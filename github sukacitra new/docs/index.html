.w{max-width:1180px;margin:0 auto;padding:16px}.card{background:var(--card);border-radius:18px;padding:18px;box-shadow:0 2px 14px #7c5cf014}
.hd{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.hd h1{margin:0;font-size:20px;color:var(--pr)}.sub{color:var(--mu);font-size:11px;margin-top:2px}

.pill.on{background:var(--pr);color:#fff;border-color:var(--pr)}.dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}

.t{font-size:11px;font-weight:800;color:var(--mu);letter-spacing:.05em;display:flex;justify-content:space-between}
.bar{height:9px;border-radius:9px;background:var(--ln);position:relative;overflow:visible}.bar>i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#7c5cf0,#9b7bff)}
.bar.o>i{background:linear-gradient(90deg,#ffb300,#ff9100)}.bar.g>i{background:linear-gradient(90deg,#10c48e,#00d9a0)}.bar b{position:absolute;top:-3px;width:2px;height:15px;background:var(--tx);opacity:.55}

.bd{display:inline-block;font-size:10px;font-weight:800;padding:4px 9px;border-radius:99px}.bd.bad{background:var(--badbg);color:var(--bad)}.bd.ok{background:var(--okbg);color:#0a9d70}.bd.na{background:var(--ln);color:var(--mu)}
.kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--ln)}.kv:last-child{border:0}.kv b{font-size:14px}
table{width:100%;border-collapse:collapse}th{font-size:10px;color:var(--mu);text-align:right;padding:8px;letter-spacing:.05em}td{padding:9px 8px;border-top:1px solid var(--ln);text-align:right}

.mini{display:inline-block;width:64px;vertical-align:middle;margin-right:6px}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px;margin-top:10px}
.ic{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:14px}.cr{margin-top:12px}.cr .h{display:flex;justify-content:space-between;font-weight:700;gap:8px}
.rk{display:flex;align-items:center;gap:10px;padding:9px 8px;border-radius:12px;cursor:pointer}.rk:hover,.rk.sel{background:var(--bg)}.nm{width:22px;font-weight:800;color:var(--mu);text-align:center}
h2{font-size:12px;letter-spacing:.06em;color:var(--mu);margin:22px 4px 0;font-weight:800}
.fb .grp{box-shadow:none;background:var(--bg)}.fb .pill{background:var(--card)}.fb .grp .pill{background:transparent}.fb .grp .pill.on,.fb .pill.on{background:var(--pr)}

 <div style="flex:1">${[['Gentle Gen',G,'GG'],['Kilau Nipis',K,'KN']].map(([n,x,k])=>`<div style="margin:8px 0"><div style="display:flex;justify-content:space-between;font-weight:700"><span style="display:flex;align-items:center;gap:6px"><img class="lg" src="${LG[k]}">${n}</span><span>${x.t?P(x.ach):'–'}</span></div><div class="bar"><i style="width:${Math.min(x.ach,1)*100}%"></i></div></div>`).join('')}</div></div>
 <div style="margin-top:12px"><span class="bd ${sc}">● ${st}</span> <span class="mu s">${st=='TERTINGGAL'?'di bawah time gone '+(tg*100).toLocaleString('id-ID',{maximumFractionDigits:1})+'%':st=='ON TRACK'?'di atas time gone':st=='TERCAPAI'?'target 100% tercapai':'belum ada target'}</span></div></div>
 <div class="card"><div class="t"><span>TARGET VS AKTUAL</span><span>${S.u=='ctn'?'karton':'rupiah'}</span></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:12px"><div style="min-width:0"><div class="lb">TARGET</div><div class="big ${S.u=='rp'?'rp':''}">${BG(A.t,A.tr)}</div><div class="mu s">${S.u=='ctn'?'ctn':RP(A.tr)}</div></div><div style="min-width:0"><div class="lb">AKTUAL</div><div class="big ${S.u=='rp'?'rp':''}" style="color:var(--pr)">${BG(A.a,A.ar)}</div><div class="mu s">${S.u=='ctn'?'ctn':RP(A.ar)}</div></div></div>
 <div class="bar g" style="margin-top:18px"><i style="width:${Math.min(A.ach,1)*100}%"></i><b style="left:${Math.min(tg,1)*100}%"></b></div><div class="mu s" style="margin-top:8px">ACH ${A.t?P(A.ach):'–'} · garis vertikal = time gone</div></div>
 <div class="card"><div class="t"><span>SISA YANG DIKEJAR</span><span>${filled}/${wk.length} week terisi</span></div><div style="margin-top:8px"><div class="kv"><span class="mu">Kurang ke 100%</span><b>${S.u=='ctn'?N1(kur)+' ctn':RP(kurR)}</b></div><div class="kv"><span class="mu">Gap / week</span><b>${S.u=='ctn'?N1(gp)+' ctn':RP(gpR)}</b></div><div class="kv"><span class="mu">Sisa week</span><b>${sisa} week</b></div></div></div></div>`;
 // SKU DETAIL
 const pk=rs.filter(r=>r.KODE_INS),gk=uniq(pk.map(r=>r.KODE_INS));
 h+=`<h2>SKU DETAIL ${S.spg?'· '+S.spg:''}${S.ch?' · '+S.ch:''}</h2><div class="card sc" style="margin-top:8px"><table><tr><th class="l">PARAMETER SKU</th><th>TARGET</th><th>AKTUAL</th><th>ACH</th><th>GAP / WEEK</th>${wl.map(w=>`<th>${w}</th>`).join('')}</tr>`+gk.map(k=>{const g=pk.filter(r=>r.KODE_INS==k),x=agg(g),gg=Math.max(x.t-x.a,0)/Math.max(sisa,1),ggR=Math.max(x.tr-x.ar,0)/Math.max(sisa,1);return`<tr><td class="l"><b>${LGI(k)}${KOD[k]||k}</b><div class="mu s">${uniq(g.map(r=>r.SKU)).join(', ')}</div></td><td>${V(x.t,x.tr)}</td><td>${V(x.a,x.ar)}</td><td><b>${x.t?P(x.ach):'–'}</b></td><td>${S.u=='ctn'?N1(gg)+' ctn':RP(ggR)}</td>${wk.map(w=>{const y=agg(g.filter(r=>r.w==w));return`<td class="mu">${S.u=='ctn'?N1(y.a):RP(y.ar)}</td>`}).join('')}</tr>`}).join('')+(gk.length?'':'<tr><td colspan=9 class="mu l">Belum ada data SKU parameter untuk filter ini.</td></tr>')+`</table></div>`;
 // tabel rincian
 const key=r=>[r.SPG,r.TOKO,r.SKU].join('|'),keys=uniq(rs.map(key)),rows=keys.map(k=>{const g=rs.filter(r=>key(r)==k),x=agg(g);return{g:g[0],x}}).filter(o=>o.x.t>0||o.x.a>0||o.g.KODE_INS).sort((a,b)=>(a.x.t?a.x.ach:-1)-(b.x.t?b.x.ach:-1)||a.g.SPG.localeCompare(b.g.SPG));
 h+=`<h2>RINCIAN PER OUTLET & SKU</h2><div class="card sc" style="margin-top:8px"><table><tr><th class="l">SPG</th><th class="l">OUTLET</th><th class="l">SKU</th><th>TARGET</th><th>AKTUAL</th><th>ACH</th><th>GAP / WEEK</th><th>STATUS</th></tr>`+rows.map(({g,x})=>{const[s2,c2]=stat(x.ach,tg,x.t);return`<tr><td class="l"><b>${g.SPG}</b></td><td class="l">${g.TOKO}</td><td class="l">${g.SKU}<span class="tg ${g.MEREK}">${LGI(g.MEREK)}${g.MEREK}</span></td><td>${S.u=='ctn'?N1(x.t):RP(x.tr)}</td><td>${S.u=='ctn'?N1(x.a):RP(x.ar)}</td><td><span class="bar o mini"><i style="width:${Math.min(x.ach,1)*100}%"></i></span><b>${x.t?P(x.ach):'0%'}</b></td><td>${S.u=='ctn'?N1(Math.max(x.t-x.a,0)/Math.max(sisa,1)):RP(Math.max(x.tr-x.ar,0)/Math.max(sisa,1))}</td><td><span class="bd ${c2}">● ${s2}</span></td></tr>`}).join('')+`</table></div>`;
 // insentif & ranking
 const shown=new Set(F(all,'spg').map(r=>r.SPG)),cardsS=spl.filter(n=>(!S.spg||n==S.spg)&&shown.has(n));
 h+=`<div class="g2" style="grid-template-columns:2fr 1fr"><div><h2 style="margin-top:0">INSENTIF SPG</h2><div class="cards">`+cardsS.map(n=>{const c=ir.filter(r=>r.SPG==n);return`<div class="ic"><div style="display:flex;justify-content:space-between;align-items:center"><div style="display:flex;gap:8px;align-items:center">${av(n,foto(n))}<div><b>${n}</b><div class="mu s">${c.length} kriteria</div></div></div><div style="text-align:right"><b style="font-size:17px">${RP(sum(c,r=>r.got))}</b><div class="mu s">potensi ${RP(sum(c,r=>r.mx))}</div></div></div>`+c.map(r=>{const rp=r.SATUAN=='RUPIAH',f=v=>rp?RP(v):N1(v);return`<div class="cr"><div class="h"><span>${r.KRITERIA}</span><span style="white-space:nowrap">${RP(r.got)} <span class="mu s">/ ${RP(r.mx)}</span></span></div><div class="bar g" style="margin:6px 0"><i style="width:${Math.min(r.ACH?num(r.ACH):0,1)*100}%"></i></div><div class="mu s" style="display:flex;justify-content:space-between"><span>${f(r.A)} / ${f(r.T)} ${rp?'':r.SATUAN.toLowerCase()} · ${P(num(r.ACH))}</span><span>${num(r.ACH)>=0.9999?'tercapai ✓':'kurang '+f(r.kur)}</span></div></div>`}).join('')+`</div>`}).join('')+`</div></div>`;
 const rk=uniq(F(all,'spg').map(r=>r.SPG)).map(n=>{const g=F(all,'spg').filter(r=>r.SPG==n);return{n,x:agg(g),tk:uniq(g.map(r=>r.TOKO)).length}}).sort((a,b)=>b.x.ach-a.x.ach||b.x.t-a.x.t);
 h+=`<div><h2 style="margin-top:0">RANKING SPG ${S.ch?'· '+S.ch:''}</h2><div class="card" style="margin-top:10px"><div class="mu s" style="margin-bottom:6px">klik untuk filter · urut berdasarkan ACH</div>`+rk.map((o,i)=>`<div class="rk ${S.spg==o.n?'sel':''}" data-k="spg" data-v="${S.spg==o.n?'':o.n}"><span class="nm">${i+1}</span>${av(o.n,foto(o.n))}<div style="flex:1"><div style="display:flex;justify-content:space-between"><b>${o.n} <span class="mu s">· ${o.tk} toko</span></b><b>${o.x.t?P(o.x.ach):'–'}</b></div><div class="bar o" style="margin:5px 0"><i style="width:${Math.min(o.x.ach,1)*100}%"></i></div><div class="mu s">${V(o.x.a,o.x.ar)} / ${V(o.x.t,o.x.tr)}</div></div></div>`).join('')+`</div></div></div>`;
 document.getElementById('app').innerHTML=h;
 document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{const k=b.dataset.k;S[k]=b.dataset.v;if(k=='area'||k=='ch'||k=='m'){S.spg='';S.toko=''}if(k=='spg')S.toko='';draw()});
 document.getElementById('chs').onchange=e=>{S.ch=e.target.value;S.spg='';S.toko='';draw()};document.getElementById('rf').onclick=load;
 document.getElementById('th').onclick=()=>{const d=document.documentElement;d.dataset.theme=d.dataset.theme=='dark'?'':'dark'};
}
load();
</script></body></html>
